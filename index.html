<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- =========================
         PRIMARY SEO
    ========================== -->

    <title>TapMilan | Digital Business Card & Smart Visiting Card</title>

    <meta
      name="description"
      content="Create your digital business card with TapMilan. Share your professional profile, WhatsApp, phone, social links and business details instantly with one tap or QR code."
    />

    <meta name="author" content="TapMilan" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <link
      rel="canonical"
      href="https://tapmilan.in/"
    />

    <!-- =========================
         FAVICON
    ========================== -->

    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <link
      rel="apple-touch-icon"
      href="/favicon.png"
    />

    <!-- =========================
         THEME
    ========================== -->

    <meta
      name="theme-color"
      content="#171717"
    />

    <!-- =========================
         OPEN GRAPH
    ========================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="TapMilan"
    />

    <meta
      property="og:title"
      content="TapMilan | Digital Business Card & Smart Visiting Card"
    />

    <meta
      property="og:description"
      content="Create your digital business card and share your professional identity instantly with one tap or QR code."
    />

    <meta
      property="og:url"
      content="https://tapmilan.in/"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <!-- OG IMAGE WILL BE ADDED AFTER WE CREATE THE ACTUAL FILE -->

    <!-- =========================
         TWITTER / X
    ========================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="TapMilan | Digital Business Card & Smart Visiting Card"
    />

    <meta
      name="twitter:description"
      content="Your professional identity, one tap away. Create and share your digital business card with TapMilan."
    />

    <!-- =========================
         ORGANIZATION SCHEMA
    ========================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TapMilan",
        "url": "https://tapmilan.in/",
        "logo": "https://tapmilan.in/favicon.png",
        "description": "TapMilan is a digital business card and smart visiting card platform for professionals and businesses."
      }
    </script>

    <!-- =========================
         WEBSITE SCHEMA
    ========================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TapMilan",
        "url": "https://tapmilan.in/",
        "description": "Digital business cards and smart visiting cards for professionals and businesses."
      }
    </script>

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
